# Kate 知识库 v5.0 配置
# 2026-07-23 · 重构为专注 HaH/Healthcare Tech 的 wiki

vault:
  name: "Kate 知识库 · 居家医疗全球研究"
  home_country: "hong-kong"
  default_language: "zh"

# 国家优先级（按与香港市场相似度 · 16 国）
countries:
  tier_1: ["hong-kong", "singapore", "taiwan", "uk"]
  tier_2: ["japan", "australia", "china"]
  tier_3: ["canada", "korea", "netherlands"]
  tier_4: ["us", "germany", "france", "sweden", "israel", "brazil"]

# 专题分类
topics:
  clinical: "topics/clinical/"
  economics: "topics/economics/"
  tech: "topics/tech/"
  workforce: "topics/workforce/"
  strategy: "topics/strategy/"
  daily: "topics/每日资讯.md"

# 报告
reports:
  source_dir: "reports/"
  naming_pattern: "YYYY-MM-DD-{company}-27dim.md"
  index_file: "reports/index.json"

# 数据
data:
  facts_file: "data/facts.json"
  entities_file: "data/entities.json"
  insights_file: "data/insights.json"
  sources_file: "data/sources.json"

# Cron
cron:
  rss_monitor: "every 6h"
  daily_briefing: "0 9 * * *"
  freshness_check: "0 9 * * 1"
